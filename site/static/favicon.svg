<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
>
  <title>hermes-hands</title>
  <!--
    The hermes-hands mark: a lowercase h, cut across the legs. The stem
    and the arch stay put. The feet land six units to the right. The brain
    stays on the host; the hands work somewhere else. The h is an outline
    of Geist Mono Medium, which is under the SIL Open Font License 1.1.
    Full colour, on its own blue tile, for any background.
  -->
  <defs>
    <path
      id="h"
      transform="translate(13.5 6.5) scale(1.3)"
      d="M0 39.3L0 0L5.6 0L5.6 16.3L5 16.1C5.4 14.5 6 13.2 6.9 12.2
        C7.8 11.1 8.9 10.4 10.1 9.9C11.4 9.4 12.8 9.2 14.3 9.2
        C16.4 9.2 18.1 9.7 19.5 10.6C21 11.6 22 12.9 22.7 14.5
        C23.5 16.2 23.8 18.2 23.8 20.3L23.8 39.3L18.2 39.3L18.2 21.8
        C18.2 19.1 17.8 17.2 16.8 15.9C15.9 14.7 14.5 14.1 12.6 14.1
        C10.5 14.1 8.8 14.7 7.5 16.1C6.2 17.4 5.6 19.4 5.6 21.9L5.6 39.3Z
        M0 39.3"
    />
    <clipPath id="stem">
      <rect width="64" height="36" />
    </clipPath>
    <clipPath id="feet">
      <rect y="38" width="64" height="26" />
    </clipPath>
  </defs>
  <rect width="64" height="64" fill="#0000f2" />
  <use href="#h" fill="#f2f2f2" clip-path="url(#stem)" />
  <g transform="translate(6 0)">
    <use href="#h" fill="#ffe600" clip-path="url(#feet)" />
  </g>
</svg>
