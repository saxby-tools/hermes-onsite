name: onsite
label: Onsite
kind: backend
version: 0.1.0
author: saxby-tools
license: AGPL-3.0-or-later
homepage: https://github.com/saxby-tools/hermes-onsite
description: >
  Open a project folder on your own computer and the Hermes that
  lives on your server works in it. Its commands and file edits run
  on the computer the folder lives on, as you, over the SSH you
  already have. The folder you open picks the computer. Risky
  commands still stop at Hermes' own approval prompt. Select it with
  `terminal.backend: onsite` and name your computers with
  `hermes onsite init`, or in Settings in the desktop app.
# The plugin reuses Hermes' local, SSH and screen-driver code, which
# is not public plugin API. It has been run on 0.23.2 only. The upper
# bound keeps it from loading at 0.24, where that code may move.
requires_hermes: ">=0.23.2,<0.24"
# The server's system. Hermes also runs on Windows, but onsite has
# never been run there, and it refuses to load on one.
platforms:
  - linux
  - macos
# The one secret the plugin reads, through Hermes. Hermes does not
# ask for it at install: it goes in the profile's `.env`. It is read
# each time a screen-sharing link opens, and by `hermes onsite
# screen`. It is used only when a machine's screen sharing asks for
# a password.
optional_env:
  - name: ONSITE_SCREEN_PASSWORD
    description: "The VNC password of a computer whose screen sharing asks for one. Leave it unset if none does."
    prompt: "Screen sharing (VNC) password"
    password: true
provides_tools:
  - propose_command
provides_hooks:
  - pre_tool_call
  - pre_llm_call
